        run: |
          python3 -c '
          import base64, io, os, zipfile
          raw = base64.b64decode(os.environ["PROJECT_B64"])
          os.makedirs("android_app", exist_ok=True)
          with zipfile.ZipFile(io.BytesIO(raw)) as zf:
              zf.extractall("android_app")
          '
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build Debug APK
        run: gradle -p android_app assembleDebug --no-daemon
      - name: Prepare APK File
        run: cp android_app/app/build/outputs/apk/debug/app-debug.apk DirectVideoDownloader.apk
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DirectVideoDownloader-APK
          path: DirectVideoDownloader.apk
      - name: Publish APK Release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_SLUG: ${{ github.repository }}
        run: |
          gh release delete v1.0 --repo "$REPO_SLUG" --yes --cleanup-tag || true
          gh release create v1.0 DirectVideoDownloader.apk --repo "$REPO_SLUG" --title "DirectVideoDownloader v1.0" --notes "Ready Android APK"
